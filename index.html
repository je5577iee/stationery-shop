<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>文具店開張囉</title>
<!--
  文具店開張囉：找錢的小遊戲
  - 最佳紀錄只存在本機瀏覽器，不蒐集任何個人資料
-->
<style>
:root{
  --blue:#2f5bea; --blue-d:#1c3fb4; --sky:#e8efff; --lemon:#ffd84d; --lemon-d:#e0b400;
  --orange:#ff8a2a; --red:#ef4f4f; --mint:#3cc3a0; --ink:#1d2433; --muted:#5d6577;
  --paper:#ffffff; --floor:#f4f1ea; --good:#20a464; --warm:#e0731a;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0; min-height:100%}
body{
  color:var(--ink); background:var(--sky);
  font-family:system-ui,-apple-system,"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;
  user-select:none; -webkit-user-select:none;
}
button{font:inherit; color:inherit; cursor:pointer; touch-action:manipulation}
button:focus-visible{outline:3px solid var(--orange); outline-offset:3px}
[hidden]{display:none !important}

/* 遮雨棚 */
.awning{height:58px; background:repeating-linear-gradient(90deg, var(--blue) 0 44px, #fff 44px 88px); position:relative; box-shadow:0 4px 0 rgba(0,0,0,.08)}
.awning::after{content:""; position:absolute; left:0; right:0; bottom:-16px; height:16px;
  background:radial-gradient(circle at 22px 0, var(--blue) 21px, transparent 22px) 0 0/88px 16px,
             radial-gradient(circle at 66px 0, #fff 21px, transparent 22px) 0 0/88px 16px}
#app{max-width:1080px; margin:0 auto; padding:26px 16px 28px; min-height:calc(100vh - 58px); display:flex; flex-direction:column}
.screen{display:none; flex:1; flex-direction:column}
.screen.active{display:flex}

/* 招牌 */
.sign{align-self:center; background:var(--lemon); border:4px solid var(--ink); border-radius:18px; padding:8px 26px 10px; text-align:center; box-shadow:6px 6px 0 var(--ink); margin:4px 0 22px; transform:rotate(-1deg)}
.sign h1{margin:0; font-size:clamp(30px,8.4vw,46px); letter-spacing:5px; line-height:1.15}
.sign p{margin:2px 0 0; font-weight:800; font-size:15px; color:#6b5300}

/* 按鈕 */
.btn{border:3px solid var(--ink); border-radius:14px; background:#fff; font-weight:900; padding:10px 16px; box-shadow:4px 4px 0 var(--ink); transition:transform .06s, box-shadow .06s}
.btn:active{transform:translate(3px,3px); box-shadow:1px 1px 0 var(--ink)}
.btn.blue{background:var(--blue); color:#fff} .btn.lemon{background:var(--lemon)} .btn.mint{background:var(--mint); color:#fff}
.btn.small{font-size:15px; padding:7px 12px; box-shadow:3px 3px 0 var(--ink)}

.box{background:var(--paper); border:3px solid var(--ink); border-radius:18px; box-shadow:6px 6px 0 rgba(29,36,51,.9)}

/* ---------- 首頁 ---------- */
.home-grid{display:grid; grid-template-columns:1fr; gap:24px; align-items:start}
.shelf{padding:16px 14px 10px}
.shelf h2{margin:0 0 10px; font-size:18px}
.shelf-row{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:6px 8px; padding-bottom:10px; border-bottom:8px solid #c9a477; margin-bottom:12px}
.goods{text-align:center}
.goods svg{width:100%; max-width:64px; height:auto; display:block; margin:0 auto}
.tag{display:inline-block; background:var(--lemon); border:2px solid var(--ink); border-radius:6px; font-size:13px; font-weight:900; padding:0 6px; margin-top:2px; white-space:nowrap}
.shelf .note{margin:2px 0 4px; font-size:13px; font-weight:700; color:var(--muted); text-align:center; line-height:1.6}
body.zy-on .shelf .note{line-height:2.2}
.levels{padding:18px}
.levels h2{margin:0 0 12px; font-size:19px}
.lv{display:flex; align-items:center; gap:12px; width:100%; text-align:left; margin-bottom:12px; padding:12px 14px}
.lv .t{font-size:21px; display:block}
.lv .d{font-size:14px; font-weight:700; color:var(--muted); display:block; margin-top:2px}
.lv .best{margin-left:auto; color:#c08a00; white-space:nowrap}
.lv .ic{width:46px; height:46px; flex-shrink:0}
.lv[aria-pressed="true"]{background:#fff6c9; box-shadow:4px 4px 0 var(--orange); border-color:var(--orange)}
.start{width:100%; font-size:23px; padding:14px; margin-top:4px}
.toggles{display:flex; gap:12px; justify-content:center; margin-top:16px; flex-wrap:wrap}
.bar-l{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
.result-tg{margin-top:18px}
/* 意見回饋 */
.fb-link{display:flex; align-items:center; gap:6px; margin:16px auto 0; background:none; border:none; color:var(--muted); font-weight:800; font-size:15px; padding:4px 8px}
.fb-link svg{width:24px; height:24px}
.fb-link:hover{color:var(--blue)}
.fb-modal{position:fixed; inset:0; background:rgba(29,36,51,.5); display:flex; align-items:center; justify-content:center; padding:16px; z-index:50}
.fb-box{max-width:440px; width:100%; padding:20px}
.fb-box h2{margin:0 0 10px; font-size:22px}
.fb-txt{font-weight:700; line-height:1.7; margin:0 0 8px}
.fb-txt.warn{color:var(--red)}
.fb-txt.small{font-size:14px; color:var(--muted)}
.fb-btns{display:flex; gap:12px; margin-top:14px}
.fb-btns .btn{flex:1; text-align:center; text-decoration:none; font-size:18px}
body.zy-on .fb-txt, body.zy-on .fb-box h2{line-height:2.2}
body.zy-on .fb-btns{flex-direction:column}

/* ---------- 遊戲 ---------- */
.bar{display:flex; align-items:center; justify-content:space-between; gap:8px 10px; flex-wrap:wrap; margin-bottom:18px}
.dots{display:flex; gap:4px}
.dots i{width:13px; height:13px; border-radius:4px; background:#fff; border:2px solid var(--ink); display:block; flex-shrink:0}
.dots i.ok{background:var(--good)} .dots i.half{background:var(--lemon)} .dots i.miss{background:#c9cdd6} .dots i.now{background:var(--orange)}
.play{display:grid; grid-template-columns:1fr; gap:22px; align-items:start}

/* 櫃檯 */
.counter{padding:14px; background:linear-gradient(#fff 0 70%, var(--floor) 70%)}
.cust{display:flex; gap:10px; align-items:flex-start}
.cust .face{width:84px; flex-shrink:0}
.bubble{position:relative; flex:1; background:#fff; border:3px solid var(--ink); border-radius:16px; padding:10px 12px; font-size:18px; font-weight:800; line-height:1.6}
.bubble::before{content:""; position:absolute; left:-12px; top:22px; border:9px solid transparent; border-right-color:var(--ink); border-left:0}
.bubble::after{content:""; position:absolute; left:-7px; top:24px; border:7px solid transparent; border-right-color:#fff; border-left:0}
.items{display:flex; flex-wrap:wrap; gap:14px; justify-content:center; margin:14px 0 6px}
.items .goods{width:92px}
.items .goods svg{max-width:84px}
.items .goods .nm{font-size:14px; font-weight:800; margin-top:2px}
.items .tag{font-size:16px}
.paid{display:flex; align-items:center; justify-content:center; gap:10px; flex-wrap:wrap; margin-top:8px; font-weight:900; font-size:18px}
.paid .money svg{height:46px; width:auto}
.total{margin-top:8px; text-align:center; font-weight:900; font-size:18px; color:var(--blue-d)}

/* 任務區 */
.task{padding:16px; text-align:center}
.goal{font-size:20px; font-weight:900; margin:0 0 12px; line-height:1.6}
.tray{min-height:96px; border:3px dashed #9aa4b8; border-radius:16px; background:#f6f8fc; padding:8px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:center}
.tray .empty{color:#9aa4b8; font-weight:800}
.tray .grp{position:relative; border:none; background:none; padding:2px; display:flex; align-items:center}
.tray .grp svg{display:block}
.tray .grp .stack{display:flex}
.tray .grp .cnt{position:absolute; right:-10px; top:-10px; background:var(--orange); color:#fff; border:2px solid var(--ink); font-size:14px; font-weight:900; border-radius:999px; padding:0 7px}
.sum{margin:8px 0 12px; font-weight:900; font-size:18px; color:var(--blue-d); min-height:26px}
.drawer{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; background:#3a4152; border:3px solid var(--ink); border-radius:14px; padding:10px}
.drawer.six{grid-template-columns:repeat(6,1fr)}
.slot{background:#525a6e; border:none; border-radius:10px; padding:8px 2px 6px; display:flex; flex-direction:column; align-items:center; gap:4px; color:#fff; font-weight:900; font-size:14px}
.slot:active{transform:translateY(2px)}
.slot svg{height:46px; width:auto; max-width:100%}
.done{width:100%; margin-top:14px; font-size:21px; padding:12px}
.row2{display:flex; gap:10px; margin-top:14px}
.sumopts{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.sumopts .btn{font-size:24px; padding:14px 6px}
.sumopts .btn.right{background:var(--good); color:#fff}
.sumopts .btn.wrong{background:#ffe1c4; opacity:.7}
.step{display:inline-block; background:var(--blue); color:#fff; border-radius:999px; font-size:14px; padding:2px 10px; margin-bottom:6px}
.row2 .btn{flex:1}
.feedback{min-height:30px; font-size:21px; font-weight:900; margin-top:12px}
.feedback.good{color:var(--good)} .feedback.warm{color:var(--warm)}
.hint{margin-top:8px; font-size:17px; font-weight:700; line-height:1.8; text-align:left; background:#fff7d6; border:2px solid #f0d36a; border-radius:12px; padding:10px 12px}
.hint:empty{display:none}
.chain{display:flex; flex-wrap:wrap; align-items:center; gap:4px; margin-top:4px}
.chain b{background:#fff; border:2px solid var(--ink); border-radius:8px; padding:0 8px}
.chain i{font-style:normal; color:var(--blue-d); font-weight:900}
.pop{animation:pop .35s ease}
@keyframes pop{50%{transform:scale(1.06)}}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* ---------- 結果 ---------- */
.result{max-width:520px; margin:12px auto 0; width:100%; padding:24px 20px; text-align:center}
.stars{display:flex; justify-content:center; gap:8px}
.stars svg{width:54px; height:54px}
.r-title{font-size:30px; font-weight:900; margin:6px 0}
.r-line{font-size:18px; font-weight:800; color:var(--muted)}
.r-face{width:110px; margin:6px auto}
.r-btns{display:flex; gap:12px; margin-top:20px}
.r-btns .btn{flex:1; font-size:19px}

/* ---------- 注音（直式，跟國語課本一樣） ---------- */
.zc{display:inline-flex; align-items:center; white-space:nowrap; text-indent:0}
.zp{position:relative; display:inline-flex; flex-direction:column; align-items:center; justify-content:center;
  font-size:max(.32em, 8px); line-height:1.05; letter-spacing:0; margin:0 .6em 0 .12em; font-weight:700}
.zp i{display:block; font-style:normal}
.zp .tn{position:absolute; left:100%; bottom:.15em; margin-left:.05em}
.zp .lt{position:absolute; top:-.9em; left:0; right:0; text-align:center}
body.zy-on .hint, body.zy-on .bubble, body.zy-on .goal{line-height:2.2}
body.zy-on .sign h1{font-size:clamp(24px,6.2vw,42px); letter-spacing:0}
.sign{max-width:100%}
body.zy-on .shelf .tag{white-space:normal; line-height:1.9; padding:2px 4px}
body.zy-on .items .tag, body.zy-on .items .nm{white-space:normal}

@media (min-width:860px){
  .home-grid{grid-template-columns:1.1fr 1fr; gap:30px}
  .play{grid-template-columns:1fr 1fr; gap:30px}
}
@media (prefers-reduced-motion: reduce){ *,*::before,*::after{animation:none !important; transition:none !important} }
</style>
</head>
<body>
<div class="awning"></div>
<div id="app">

  <!-- 首頁 -->
  <section id="home" class="screen active">
    <div class="sign"><h1 data-zy="">文具店開張囉</h1><p data-zy="">當一天文具店的小老闆</p></div>
    <div class="home-grid">
      <div class="box shelf"><h2 data-zy="">今天的商品</h2><div id="shelf"></div><p class="note" data-zy="">遊戲裡的錢幣和鈔票只畫出面額，是練習用的，不是真的錢喔！</p><p class="note" data-zy="">商品的價錢不是真實的價錢，僅供學習用。</p></div>
      <div class="box levels">
        <h2 data-zy="">選難度</h2>
        <div id="levelOpts"></div>
        <button class="btn blue start" id="startBtn" data-zy="">開店囉！</button>
        <div class="toggles">
          <button class="btn small soundBtn"></button>
          <button class="btn small lemon zyBtn"></button>
        </div>
        <button class="fb-link" id="fbBtn" aria-label="意見回饋"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H10l-5 4v-4H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z" fill="#fff" stroke="#1d2433" stroke-width="1.8" stroke-linejoin="round"/><path d="M8 10h8M8 13h5" stroke="#2f5bea" stroke-width="1.8" stroke-linecap="round"/></svg><span data-zy="">意見回饋</span></button>
      </div>
    </div>
  </section>

  <!-- 遊戲 -->
  <section id="game" class="screen">
    <div class="bar">
      <div class="bar-l">
        <button class="btn small" id="backBtn" data-zy="">回首頁</button>
        <button class="btn small soundBtn"></button>
        <button class="btn small lemon zyBtn"></button>
      </div>
      <div class="dots" id="dots"></div>
    </div>
    <div class="play">
      <div class="box counter">
        <div class="cust"><div class="face" id="face"></div><div class="bubble" id="bubble"></div></div>
        <div class="items" id="items"></div>
        <div class="total" id="total"></div>
        <div class="paid" id="paid"></div>
      </div>
      <div class="box task">
        <p class="goal" id="goal"></p>
        <div class="sumopts" id="sumOpts" hidden></div>
        <div id="changeArea">
        <div class="tray" id="tray"></div>
        <div class="sum" id="sum"></div>
        <div class="drawer" id="drawer"></div>
        <div class="row2">
          <button class="btn" id="clearBtn" data-zy="">全部拿回來</button>
          <button class="btn mint" id="doneBtn"></button>
        </div>
        </div>
        <div class="feedback" id="feedback"></div>
        <div class="hint" id="hint"></div>
        <button class="btn blue done" id="nextBtn" hidden></button>
      </div>
    </div>
  </section>

  <!-- 結果 -->
  <section id="result" class="screen">
    <div class="box result" id="resultBox"></div>
    <div class="toggles result-tg">
      <button class="btn small soundBtn"></button>
      <button class="btn small lemon zyBtn"></button>
    </div>
  </section>

  <!-- 意見回饋 -->
  <div class="fb-modal" id="fbModal" hidden>
    <div class="box fb-box">
      <h2 data-zy="">有什麼想法嗎？告訴我們！</h2>
      <p class="fb-txt" data-zy="">好玩的地方、看不懂的地方、哪裡怪怪的，都可以寫下來。</p>
      <p class="fb-txt warn" data-zy="">請不要寫下名字、學校、電話這些個人資料喔！</p>
      <p class="fb-txt small" data-zy="">按下去會打開一個新的網頁表單，需要網路。</p>
      <div class="fb-btns"><button class="btn" id="fbClose" data-zy="">先不用了</button><a class="btn blue" id="fbGo" target="_blank" rel="noopener noreferrer" data-zy="">好，我要填寫</a></div>
      <p class="fb-txt small" id="fbNone" hidden data-zy="">（回饋表單還沒設定好）</p>
    </div>
  </div>
</div>

<script>
/* =====================================================================
   設定區
   ===================================================================== */
const TOTAL = 8;   // 一回幾位客人
const LEVELS = {
  easy: { name:'簡單', desc:'幫小客人湊出剛好的錢', money:[1,5,10,50] },

};
/* 商品：名字、價錢（元） */
const GOODS = [
  { k:'pencil', name:'鉛筆',   price:8 },
  { k:'eraser', name:'橡皮擦', price:12 },
  { k:'sticker',name:'貼紙',   price:10 },
  { k:'ruler',  name:'尺',     price:15 },
  { k:'glue',   name:'膠水',   price:18 },
  { k:'notes',  name:'便利貼', price:20 },
  { k:'book',   name:'筆記本', price:25 },
  { k:'scissor',name:'剪刀',   price:35 },
  { k:'marker', name:'彩色筆', price:45 },
  { k:'crayon', name:'蠟筆',   price:60 },
  { k:'case',   name:'鉛筆盒', price:120 }
];
/* 量詞：買好幾個的時候用，例如「2 枝鉛筆」 */
const MW = { pencil:'枝', eraser:'個', sticker:'張', ruler:'把', glue:'瓶', notes:'本', book:'本', scissor:'把', marker:'盒', crayon:'盒', case:'個' };
const PRAISE  = ['謝謝老闆！','太棒了，剛剛好！','你是很棒的小老闆！','完全正確！'];
const COMFORT = ['沒關係！','差一點點！','加油，你可以的！','再數一次！'];

/* ===== 小工具 ===== */
const $ = function(id){ return document.getElementById(id); };
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
function randInt(a,b){ return a + Math.floor(Math.random()*(b-a+1)); }
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function show(id){ document.querySelectorAll('.screen').forEach(function(s){ s.classList.toggle('active', s.id===id); }); window.scrollTo(0,0); }
const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const store = (function(){
  try{ const s = JSON.parse(localStorage.getItem('little-shop')); if(s) return s; }catch(e){}
  return { level:'easy', zhuyin:false, best:{} };
})();
function save(){ try{ localStorage.setItem('little-shop', JSON.stringify(store)); }catch(e){} }

/* =====================================================================
   原創圖案：文具、錢、客人
   ===================================================================== */
const O = 'stroke="#1d2433" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"';
function goodsSVG(k){
  const g = {
    pencil: '<g transform="rotate(-35 30 30)"><rect x="10" y="24" width="34" height="12" fill="#ffd84d" '+O+'/><path d="M44 24 l10 6 -10 6z" fill="#f7d8b0" '+O+'/><path d="M51 28.2 l3 1.8 -3 1.8z" fill="#1d2433"/><rect x="5" y="24" width="7" height="12" rx="2" fill="#ff8fb1" '+O+'/><path d="M10 30 h34" stroke="#e0b400" stroke-width="1.6"/></g>',
    eraser: '<rect x="12" y="20" width="36" height="22" rx="5" fill="#fff" '+O+'/><path d="M24 20 h16 v22 h-16z" fill="#2f5bea" '+O+'/><path d="M28 28 h8 M28 33 h8" stroke="#fff" stroke-width="2"/>',
    sticker:'<path d="M30 50 C14 39 8 31 8 23 C8 15 14 10 20.5 10 C25 10 28.5 12.5 30 16 C31.5 12.5 35 10 39.5 10 C46 10 52 15 52 23 C52 31 46 39 30 50 Z" fill="#ff6f91" '+O+'/><path d="M17 21 q2 -5 7 -5" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".85"/>',
    ruler:  '<g transform="rotate(-20 30 30)"><rect x="4" y="23" width="52" height="14" rx="2" fill="#3cc3a0" '+O+'/><path d="M10 23v5M16 23v8M22 23v5M28 23v8M34 23v5M40 23v8M46 23v5M52 23v8" stroke="#1d2433" stroke-width="1.6"/></g>',
    glue:   '<rect x="19" y="20" width="22" height="32" rx="6" fill="#fff" '+O+'/><rect x="19" y="30" width="22" height="12" fill="#ff8a2a" '+O+'/><path d="M24 20 v-6 h12 v6" fill="#ef4f4f" '+O+'/><path d="M28 14 v-6 h4 v6" fill="#ef4f4f" '+O+'/>',
    notes:  '<rect x="16" y="18" width="32" height="32" rx="3" fill="#ffb3c7" '+O+'/><rect x="12" y="14" width="32" height="32" rx="3" fill="#ffd84d" '+O+'/><path d="M17 24 h22 M17 30 h22 M17 36 h14" stroke="#c99a00" stroke-width="2"/>',

let ac = null, soundOn = true;
function tone(freqs, dur, type, gap){
  if(!soundOn) return;
  try{
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    freqs.forEach(function(f,i){
      const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + i*(gap||dur);
      o.type = type||'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.18, t+0.01); g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
      o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+dur+0.02);
    });
  }catch(e){}
}

function rubyOf(c, z){
  let light = false, tn = '';
  if(z.charAt(0)==='˙'){ light = true; z = z.slice(1); }
  if('ˊˇˋ'.indexOf(z.charAt(z.length-1)) >= 0){ tn = z.charAt(z.length-1); z = z.slice(0,-1); }

  for(let k=0;k<z.length;k++) col += '<i>'+z.charAt(k)+'</i>';

}
function zy(str){
  return String(str).split(/(<[^>]*>)/).map(function(part){
    if(part.charAt(0)==='<') return part;
    let out = '', i = 0;
    while(i < part.length){
      let hit = null;
      for(const w in ZY_WORDS){ if(part.substr(i,w.length)===w){ hit = w; break; } }
      if(hit){ for(let k=0;k<hit.length;k++) out += rubyOf(hit[k], ZY_WORDS[hit][k]); i += hit.length; continue; }
      const c = part[i]; out += ZY[c] ? rubyOf(c, ZY[c]) : c; i++;
    }
    return out;
  }).join('');
}

  $('levelOpts').innerHTML = Object.keys(LEVELS).map(function(k){
    const b = store.best[k];
    return '<button class="btn lv" data-level="'+k+'" aria-pressed="'+(store.level===k)+'"><span class="ic">'+icons[k]+'</span><span><span class="t">'+Z(LEVELS[k].name)+'</span><span class="d">'+Z(LEVELS[k].desc)+'</span></span>'
      + (b ? '<span class="best">'+'★'.repeat(b)+'☆'.repeat(3-b)+'</span>' : '') + '</button>';
  }).join('');
  document.querySelectorAll('.lv .ic svg').forEach(function(s){ s.style.width = '100%'; s.style.height = '100%'; });
  document.querySelectorAll('[data-level]').forEach(function(b){ b.onclick = function(){ store.level = b.dataset.level; save(); renderHome(); }; });
  renderToggles();
}
/* 音效、注音開關：首頁、遊戲中、結果頁都有，隨時可以切換 */
function renderToggles(){
  document.querySelectorAll('.soundBtn').forEach(function(b){ b.innerHTML = Z('音效：' + (soundOn ? '開' : '關')); });
  document.querySelectorAll('.zyBtn').forEach(function(b){ b.innerHTML = 'ㄅ ' + Z('注音：' + (store.zhuyin ? '開' : '關')); });
}
document.querySelectorAll('.soundBtn').forEach(function(b){ b.onclick = function(){ soundOn = !soundOn; renderToggles(); b.blur(); }; });
document.querySelectorAll('.zyBtn').forEach(function(b){ b.onclick = function(){
  store.zhuyin = !store.zhuyin; save(); refreshZy();
  /* 遊戲進行中切換：把畫面上已經出現的文字加上或拿掉注音，題目不會重來 */
  ['game','result'].forEach(function(id){ if($(id).classList.contains('active')) convertZy($(id), store.zhuyin); });
  b.blur();
}; });
function refreshZy(){ document.body.classList.toggle('zy-on', !!store.zhuyin); applyStaticZy(); renderHome(); }

/* 把一塊畫面裡的文字加上注音（on）或拿掉注音（off）；SVG 裡的字不動 */
function escTxt(t){ return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function convertZy(root, on){
  if(!on){
    root.querySelectorAll('.zc').forEach(function(el){ el.replaceWith(document.createTextNode(el.firstChild ? el.firstChild.textContent : '')); });
    root.normalize();
    return;
  }
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode: function(n){
      if(!/[一-鿿]/.test(n.nodeValue)) return NodeFilter.FILTER_REJECT;
      if(n.parentNode.closest('.zc, svg, script, style')) return NodeFilter.FILTER_REJECT;
      return NodeFilter.FILTER_ACCEPT;
    }
  });
  const nodes = [];
  while(walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(function(n){
    const tmp = document.createElement('span');
    tmp.innerHTML = zy(escTxt(n.nodeValue));
    const frag = document.createDocumentFragment();
    while(tmp.firstChild) frag.appendChild(tmp.firstChild);
    n.replaceWith(frag);
  });
}

/* ===== 意見回饋 ===== */
const FEEDBACK_URL = 'https://docs.google.com/forms/d/e/1FAIpQLSdI7dj-2c6DyenytiPzBN5ztsY4_0m4JI-Z8LYKYW4JOYqleQ/viewform';
$('fbBtn').onclick = function(){
  const ok = /^https:\/\//.test(FEEDBACK_URL);
  $('fbGo').hidden = !ok; $('fbNone').hidden = ok;
  if(ok) $('fbGo').href = FEEDBACK_URL;
  $('fbModal').hidden = false;
};
$('fbClose').onclick = function(){ $('fbModal').hidden = true; };
$('fbGo').addEventListener('click', function(){ setTimeout(function(){ $('fbModal').hidden = true; }, 300); });
$('fbModal').addEventListener('click', function(e){ if(e.target === $('fbModal')) $('fbModal').hidden = true; });

/* =====================================================================
   出題
   ===================================================================== */
let level, qi, q, results, locked, tray, custIdx, timers = [];
function later(fn, ms){ timers.push(setTimeout(fn, ms)); }
function clearTimers(){ timers.forEach(clearTimeout); timers = []; }

/* 用最少的錢湊出 n 元（新台幣面額用「先拿大的」就是最少） */
function fewest(n, denoms){
  const out = {}, ds = denoms.slice().sort(function(a,b){ return b-a; });
  ds.forEach(function(d){ const c = Math.floor(n/d); if(c){ out[d] = c; n -= c*d; } });
  return out;
}
function describe(cnt){
  return Object.keys(cnt).map(Number).sort(function(a,b){ return b-a; }).map(function(d){ return cnt[d]+' 個 '+d+' 元'; }).join('、');
}
function priceOf(g){ return level==='easy' ? g.price : g.price + pick([0,0,1,2,3,-1,-2]); }

/* 同一回不出重複的題目：先試幾次抽到沒出過的，真的抽不到才接受重複 */
function makeQ(){
  let q0 = null;
  for(let t=0;t<60;t++){
    q0 = makeQ1();
    const key = q0.items.map(function(x){ return x.g.k+'x'+(x.qty||1)+'@'+x.price; }).sort().join('+') + '|' + q0.pay;
    if(!usedQ.has(key)){ usedQ.add(key); break; }
  }
  return q0;
}
function makeQ1(){
  if(level==='easy'){
    /* 4 成的機會買好幾個（2 或 3 個便宜的東西，一共不超過 60 元） */
    if(Math.random() < 0.4){
      const g = pick(GOODS.filter(function(x){ return x.price <= 20; }));
      const n = g.price*3 <= 60 && Math.random() < 0.4 ? 3 : 2;
      return { items:[{ g:g, price:g.price, qty:n }], total:g.price*n, pay:null, target:g.price*n };
    }
    const g = pick(GOODS.filter(function(x){ return x.price <= 60; }));
    const items = [{ g:g, price:g.price, qty:1 }];
    return { items:items, total:g.price, pay:null, target:g.price };
  }
  if(level==='mid'){
    for(let t=0;t<100;t++){
      const n = Math.random() < 0.5 ? 1 : 2;
      const gs = shuffle(GOODS.filter(function(x){ return x.price <= 45; })).slice(0, n);
      const items = gs.map(function(g){ return { g:g, price:priceOf(g) }; });
      const total = items.reduce(function(s,x){ return s + x.price; }, 0);
      const pay = total < 50 && Math.random() < 0.5 ? 50 : 100;
      if(total >= pay || total > 95) continue;
      return { items:items, total:total, pay:pay, target:pay-total };
    }
  }
  for(let t=0;t<100;t++){
    const n = randInt(2,3);
    const gs = shuffle(GOODS.slice()).slice(0, n);
    const items = gs.map(function(g){ return { g:g, price:priceOf(g) }; });
    const total = items.reduce(function(s,x){ return s + x.price; }, 0);
    const pay = total < 100 ? (Math.random() < 0.5 ? 100 : 500) : 500;
    if(total >= pay) continue;
    return { items:items, total:total, pay:pay, target:pay-total };
  }
}

/* =====================================================================
   遊戲流程
   ===================================================================== */
let usedQ = new Set();
function startGame(){ level = store.level; qi = 0; results = []; usedQ = new Set(); custIdx = randInt(0,4); clearTimers(); show('game'); nextQ(); }
function renderDots(){ let s=''; for(let i=0;i<TOTAL;i++){ const r=results[i]; s += '<i class="'+(r||(i===qi?'now':''))+'"></i>'; } $('dots').innerHTML = s; }
function itemNames(){ return q.items.map(function(x){ return (x.qty > 1 ? x.qty+' '+MW[x.g.k] : '') + x.g.name; }).join('和'); }
function isMulti(){ return q.items.length===1 && q.items[0].qty > 1; }

function nextQ(){
  clearTimers();
  if(qi >= TOTAL){ finish(); return; }
  q = makeQ(); q.retry = false; q.sumRetry = false; q.sumMiss = false; locked = false; tray = {}; custIdx++;
  $('face').innerHTML = faceSVG(custIdx, false);
  $('items').innerHTML = q.items.map(function(x){
    let one = '<div class="goods">'+goodsSVG(x.g.k)+'<div class="nm">'+Z(x.g.name)+'</div><span class="tag">'+Z(x.price+' 元')+'</span></div>';
    return new Array((x.qty||1)+1).join(one);
  }).join('');
  if(level==='easy'){
    if(isMulti()){
      const x = q.items[0];
      $('bubble').innerHTML = Z('我想買'+itemNames()+'，一'+MW[x.g.k]+' '+x.price+' 元。可以幫我拿出剛好的錢嗎？');
      $('goal').innerHTML = Z(x.qty+' '+MW[x.g.k]+x.g.name+'一共多少錢？從錢箱拿出剛好的錢');
    }else{
      $('bubble').innerHTML = Z('我想買'+itemNames()+'，可是我不太會數錢，可以幫我拿出 '+q.total+' 元嗎？');
      $('goal').innerHTML = Z('從錢箱拿出剛好 '+q.total+' 元');
    }
    $('total').innerHTML = ''; $('paid').innerHTML = '';
    $('doneBtn').innerHTML = Z('拿好了');
  }else{
    $('bubble').innerHTML = Z('我要買'+itemNames()+'。這是 '+q.pay+' 元，請找錢給我！');
    $('total').innerHTML = level==='mid' ? Z('一共 '+q.total+' 元') : '';
    $('paid').innerHTML = Z('客人給你') + '<span class="money">'+moneySVG(q.pay)+'</span>';
    $('goal').innerHTML = Z('要找客人多少錢？從錢箱拿出來');
    $('doneBtn').innerHTML = Z('找好了');
  }
  $('drawer').className = 'drawer' + (LEVELS[level].money.length > 4 ? ' six' : '');
  $('drawer').innerHTML = LEVELS[level].money.map(function(v){ return '<button class="slot" data-v="'+v+'">'+moneySVG(v)+'<span>'+Z(v+' 元')+'</span></button>'; }).join('');
  Array.from($('drawer').children).forEach(function(b){ b.onclick = function(){ addMoney(+b.dataset.v); }; });
  $('feedback').className = 'feedback'; $('feedback').textContent = '';
  $('hint').innerHTML = ''; $('nextBtn').hidden = true;
  $('doneBtn').disabled = false; $('clearBtn').disabled = false;
  renderTray(); renderDots();
  if(level==='hard') askSum(); else showChange();
}

/* ===== 困難：第一步先算一共多少錢 ===== */
function showChange(){ q.phase = 'change'; $('sumOpts').hidden = true; $('changeArea').hidden = false; }
function askSum(){
  q.phase = 'sum';
  $('changeArea').hidden = true; $('sumOpts').hidden = false;
  $('goal').innerHTML = '<span class="step">'+Z('第 1 步')+'</span><br>' + Z('客人買的東西，一共多少錢？');
  const t = q.total, set = new Set([t]);
  shuffle([t+10, t-10, t+1, t-1, t+5, t-5, t+100]).forEach(function(v){ if(set.size < 4 && v > 0) set.add(v); });
  $('sumOpts').innerHTML = shuffle(Array.from(set)).map(function(v){ return '<button class="btn" data-v="'+v+'">'+Z(v+' 元')+'</button>'; }).join('');
  Array.from($('sumOpts').children).forEach(function(b){ b.onclick = function(){ answerSum(+b.dataset.v, b); }; });
}
function sumSteps(){
  /* 一樣一樣加：8 + 122 = 130，130 + 25 = 155 */
  let cur = q.items[0].price, out = [];
  for(let i=1;i<q.items.length;i++){ out.push(cur+' + '+q.items[i].price+' = '+(cur+q.items[i].price)); cur += q.items[i].price; }
  return out;
}
function answerSum(v, btn){
  if(q.phase !== 'sum' || btn.disabled) return;
  if(v === q.total){
    btn.classList.add('right'); sCoin(); goChange('對了！一共 '+q.total+' 元，接著找錢給客人。');
    return;
  }
  btn.classList.add('wrong'); btn.disabled = true; sSoft();
  if(!q.sumRetry){
    q.sumRetry = true;
    const st = sumSteps();
    $('feedback').className = 'feedback warm';
    $('feedback').innerHTML = Z(pick(COMFORT) + '看看提示，再算一次！');
    $('hint').innerHTML = Z('一樣一樣加起來：先算 '+st[0].split(' = ')[0]+' = ?' + (st.length > 1 ? '，再把答案加 '+q.items[2].price+'。' : '。')
      + '<br>小秘訣：先加整十、整百的部分，再加剩下的。');
  }else{
    q.sumMiss = true;
    Array.from($('sumOpts').children).forEach(function(b){ if(+b.dataset.v === q.total) b.classList.add('right'); });
    goChange('沒關係！' + sumSteps().join('，') + '，一共 '+q.total+' 元。接著找錢給客人。');
  }
}
function goChange(msg){
  q.phase = 'wait';
  $('feedback').className = 'feedback good';
  $('feedback').innerHTML = Z(msg);
  $('hint').innerHTML = '';
  $('total').innerHTML = Z('一共 '+q.total+' 元');
  later(function(){
    showChange();
    $('goal').innerHTML = '<span class="step">'+Z('第 2 步')+'</span><br>' + Z('要找客人多少錢？從錢箱拿出來');
    $('feedback').className = 'feedback'; $('feedback').textContent = '';
  }, 1600);
}

function traySum(){ return Object.keys(tray).reduce(function(s,d){ return s + d*tray[d]; }, 0); }
function trayCount(){ return Object.keys(tray).reduce(function(s,d){ return s + tray[d]; }, 0); }
function renderTray(){
  const ds = Object.keys(tray).map(Number).filter(function(d){ return tray[d] > 0; }).sort(function(a,b){ return b-a; });
  $('tray').innerHTML = ds.length ? ds.map(function(d){
    const st = moneySVG(d);
    return '<button class="grp" data-v="'+d+'" aria-label="拿回一個 '+d+' 元"><span class="stack">'+st+'</span>'+(tray[d] > 1 ? '<span class="cnt">×'+tray[d]+'</span>' : '')+'</button>';
  }).join('') : '<span class="empty">'+Z('點下面的錢，放到這個盤子上')+'</span>';
  Array.from($('tray').querySelectorAll('.grp')).forEach(function(b){ b.onclick = function(){ removeMoney(+b.dataset.v); }; });
  $('sum').innerHTML = level==='hard' ? Z('盤子上的錢自己數數看') : Z('盤子上有 '+traySum()+' 元');
}
function addMoney(v){ if(locked) return; tray[v] = (tray[v]||0) + 1; sCoin(); renderTray(); }
function removeMoney(v){ if(locked || !tray[v]) return; tray[v]--; if(!tray[v]) delete tray[v]; renderTray(); }
$('clearBtn').onclick = function(){ if(locked) return; tray = {}; renderTray(); };

/* ===== 提示 ===== */
function countUp(from, to){
  /* 往上數：先湊到 5 的倍數，再到 10、50、100……的倍數，一路數到客人給的錢 */
  const steps = []; let cur = from;
  [5, 10, 50, 100, 500, 1000].forEach(function(m){
    const nx = Math.ceil(cur/m)*m;
    if(nx > cur && nx <= to){ steps.push({ add:nx-cur, to:nx }); cur = nx; }
  });
  if(cur < to) steps.push({ add:to-cur, to:to });
  return '<div class="chain"><b>'+from+'</b>' + steps.map(function(st){ return '<i>＋'+st.add+'→</i><b>'+st.to+'</b>'; }).join('') + '</div>';
}
function hintHTML(){
  const have = traySum(), diff = q.target - have;
  let t = '';
  if(level==='easy'){
    if(isMulti()){
      const x = q.items[0];
      t = '一'+MW[x.g.k]+' '+x.price+' 元，買 '+x.qty+' '+MW[x.g.k]+'，就是 '+new Array(x.qty+1).join(x.price+' + ').slice(0,-3)+' = ?<br>';
    }
    t += diff > 0 ? '盤子上有 '+have+' 元，還差 '+diff+' 元。' : '盤子上有 '+have+' 元，多了 '+(-diff)+' 元，點盤子上的錢可以拿回來。';
    t += '<br>小秘訣：先拿大的錢，例如先拿 10 元，再拿 5 元，最後用 1 元補齊。';
    return t;
  }
  t += '要找的錢 = 客人給的錢 − 東西的價錢：'+q.pay+' − '+q.total+' = ?<br>';
  t += '也可以從 '+q.total+' 往上數到 '+q.pay+'，加了多少就找多少：' + countUp(q.total, q.pay);
  t += '你現在盤子上放了 '+have+' 元。';
  return t;
}

/* ===== 作答 ===== */
$('doneBtn').onclick = function(){
  if(locked) return;
  const have = traySum();
  if(have === q.target){
    locked = true;
    results[qi] = (q.retry || q.sumRetry || q.sumMiss) ? 'half' : 'ok';
    sRegister();
    $('face').innerHTML = faceSVG(custIdx, true);
    $('tray').classList.remove('pop'); void $('tray').offsetWidth; $('tray').classList.add('pop');
    const best = fewest(q.target, LEVELS[level].money), bestN = Object.keys(best).reduce(function(s,d){ return s + best[d]; }, 0);
    let msg = q.retry ? '你自己找到答案了！' : pick(PRAISE);
    if(level==='hard' && trayCount() === bestN) msg += '而且用了最少的錢！';
    $('feedback').className = 'feedback good'; $('feedback').innerHTML = Z(msg);
    done(); return;
  }
  sSoft();
  $('tray').classList.remove('shake'); void $('tray').offsetWidth; $('tray').classList.add('shake');
  if(!q.retry){
    q.retry = true;
    $('feedback').className = 'feedback warm';
    $('feedback').innerHTML = Z(pick(COMFORT) + '看看提示，再試一次！');
    $('hint').innerHTML = Z(hintHTML());
  }else{
    locked = true; results[qi] = 'miss';
    tray = fewest(q.target, LEVELS[level].money); renderTray();
    $('sum').innerHTML = Z('盤子上有 '+q.target+' 元');
    $('feedback').className = 'feedback warm';
    $('feedback').innerHTML = Z('沒關係！可以這樣'+(level==='easy'?'拿':'找'));
    $('hint').innerHTML = Z((level==='easy' ? '' : q.pay+' − '+q.total+' = '+q.target+'，要找 '+q.target+' 元。<br>')
      + (isMulti() ? (function(x){ return '一'+MW[x.g.k]+' '+x.price+' 元，'+x.qty+' '+MW[x.g.k]+'就是 '+new Array(x.qty+1).join(x.price+' + ').slice(0,-3)+' = '+q.target+' 元。<br>'; })(q.items[0]) : '')
      + '用最少的錢：'+describe(tray)+'。');
    done();
  }
};
function done(){
  qi++; renderDots();
  $('doneBtn').disabled = true; $('clearBtn').disabled = true;
  $('nextBtn').innerHTML = Z(qi >= TOTAL ? '打烊囉，看結果' : '下一位客人');
  $('nextBtn').hidden = false;
}
$('nextBtn').onclick = nextQ;
$('backBtn').onclick = function(){ clearTimers(); renderHome(); show('home'); };
$('startBtn').onclick = startGame;
document.addEventListener('keydown', function(e){
  if($('game').classList.contains('active') && !$('nextBtn').hidden && (e.key==='Enter' || e.key===' ')){ e.preventDefault(); nextQ(); }
});

/* ===== 結果 ===== */
function finish(){
  const ok = results.filter(function(r){ return r==='ok'; }).length, half = results.filter(function(r){ return r==='half'; }).length;
  const pts = (ok + half*0.5)/TOTAL, stars = pts>=0.9 ? 3 : pts>=0.7 ? 2 : pts>=0.4 ? 1 : 0;
  if(!store.best[level] || stars > store.best[level]) store.best[level] = stars;
  save();
  $('resultBox').innerHTML = Z('<div class="stars">'+[0,1,2].map(function(i){ return starSVG(i<stars); }).join('')+'</div>'
    + '<div class="r-face">'+faceSVG(custIdx, true)+'</div>'
    + '<div class="r-title">'+['明天再來開店吧！','不錯喔！','很厲害的小老闆！','超級小老闆！'][stars]+'</div>'
    + '<div class="r-line">'+LEVELS[level].name+'　'+TOTAL+' 位客人，做對 '+(ok+half)+' 位'+(half?'（其中 '+half+' 位看了提示）':'')+'</div>'
    + '<div class="r-btns"><button class="btn blue" id="againBtn">再開一次店</button><button class="btn" id="homeBtn">回首頁</button></div>');
  $('againBtn').onclick = startGame;
  $('homeBtn').onclick = function(){ renderHome(); show('home'); };
  show('result');
  if(stars >= 2) sRegister();
}

refreshZy();
